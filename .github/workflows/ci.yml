# The landing gate on every push and pull request, mirroring `make check`.
#
# `rodio`'s Linux backend (`cpal`) links against ALSA through `alsa-sys`, whose
# build script runs `pkg-config` and fails without the ALSA development
# headers; the apt step installs them before cargo builds. The toolchain action
# provides a current stable Rust with the `rustfmt` and `clippy` components
# `make check` requires. The runner's `TMPDIR` is a normal disk-backed path,
# unlike some sandboxes, so no extra temp-dir override is needed.
name: CI

on:
  push:
  pull_request:

# Least privilege: the gate only reads the repository (checkout), so the
# workflow's default broad `GITHUB_TOKEN` is narrowed to read-only contents.
permissions:
  contents: read

# One run per ref: a newer push to a branch supersedes the older run, so the
# superseded gate is cancelled instead of continuing to hold a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    # A hung build or test would otherwise occupy a runner until GitHub's
    # six-hour default; the gate finishes in minutes, so bound it well below
    # that to free the runner and report the hang as a failure.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the Linux audio build dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run the landing gate
        run: make check
