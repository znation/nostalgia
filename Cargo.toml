[package]
name = "nostalgia"
version = "0.1.0"
edition = "2024"
# Minimum supported Rust version: edition 2024 needs >=1.85 and iced 0.14
# declares rust-version 1.88, so 1.88 is the floor for this crate.
rust-version = "1.88"

[dependencies]
iced = "0.14.0"
iced_native = "0.10.3"
reqwest = "0.12.28"
serde = "1.0.228"
tokio = {version = "1.48.0", features = ["sync"]}
