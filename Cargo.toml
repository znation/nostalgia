[package]
name = "nostalgia"
version = "0.1.0"
edition = "2024"
# Minimum supported Rust version: edition 2024 needs >=1.85 and iced 0.14
# declares rust-version 1.88, so 1.88 is the floor for this crate.
rust-version = "1.88"

[dependencies]
# `iced_native` was dropped with the iced 0.14 port (no longer referenced).
# tokio `macros` + `rt` power the `#[tokio::test]` runtime in apple_music.
iced = "0.14.0"
serde = "1.0.228"
tokio = {version = "1.48.0", features = ["sync", "macros", "rt"]}

[dev-dependencies]
# Test-only: drive an iced `Task` returned by `update` to completion, as the
# iced runtime would, so the UI→service wiring is exercised end to end. Both
# are already in the dependency tree as transitive deps of `iced`, so no new
# crates are introduced.
futures = "0.3"
iced_runtime = "0.14.0"
# Test-only: exercise the library model's serde contract (the JSON seam the
# real Apple Music API will populate).
serde_json = "1.0.146"
