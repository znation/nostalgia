[package]
name = "nostalgia"
version = "0.1.0"
edition = "2024"
# Minimum supported Rust version: edition 2024 needs >=1.85 and iced 0.14
# declares rust-version 1.88, so 1.88 is the floor for this crate.
rust-version = "1.88"
# Package metadata: `cargo package` warns when the manifest has no
# description or license. The SPDX identifier matches the BSD-3-Clause
# LICENSE file at the repo root, and the repository is the project's GitHub
# home.
description = "A Winamp 2.x UI clone in Rust, using Apple Music as the music library."
license = "BSD-3-Clause"
repository = "https://github.com/znation/nostalgia"

[dependencies]
# `iced_native` was dropped with the iced 0.14 port (no longer referenced).
iced = "0.14.0"
# `derive` is requested explicitly: `library` and `apple_music` use
# `#[derive(Serialize, Deserialize)]`, and without this the crate would compile
# only because a transitive iced dependency (zbus) happens to enable the
# feature. Naming it here keeps the derive macros ours, not a side effect.
serde = { version = "1.0.228", features = ["derive"] }
# `macros` + `rt` power the `#[tokio::test]` runtime in apple_music.
tokio = { version = "1.48.0", features = ["sync", "macros", "rt"] }

[dev-dependencies]
# Test-only: drive an iced `Task` returned by `update` to completion, as the
# iced runtime would, so the UI→service wiring is exercised end to end. Both
# are already in the dependency tree as transitive deps of `iced`, so no new
# crates are introduced.
futures = "0.3"
iced_runtime = "0.14.0"
# Test-only: exercise the library model's serde contract (the JSON seam the
# real Apple Music API will populate).
serde_json = "1.0.146"
